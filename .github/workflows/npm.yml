# The npm package alias-support, published from the tarball on this repository's release, by npm's
# trusted publishing (this workflow's OpenID Connect identity: no token, provenance attached).
# On npmjs.com, the package's trusted publisher: GitHub Actions, emdzej/alias-releases, npm.yml.
name: npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish (X.Y.Z)
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          npm install -g npm@^11.5.1
          # already there (a re-run): nothing to do
          if [ -n "$(npm view "alias-support@$TAG" version 2>/dev/null)" ]; then echo "alias-support $TAG is already on npm"; exit 0; fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'alias-support-*.tgz'
          dist=latest; case "$TAG" in *-*) dist=next;; esac
          [ "$PRERELEASE" = true ] && dist=next
          npm publish ./alias-support-*.tgz --access public --tag "$dist"
